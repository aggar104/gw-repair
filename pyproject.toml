[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwrepair"
version = "0.1.0"
description = "GW glitch repair pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "omegaconf>=2.3,<3.0",
    "torch>=2.10,<2.11",
    "matplotlib>=3.10,<3.11",
    "ml4gw>=0.7.12,<0.8",
    "hydra-core>=1.3.2,<2.0",
    "coverage[toml]>=7.6.10,<8",
    "pre-commit~=2.16",
    "pytest~=7.0",
    "lalsuite~=7.0",
    "jupyter>=1.0.0,<2",
    "gwpy~=3.0",
    "pytest-repeat>=0.9.3,<0.10",
    "h5py~=3.12",
    "torchmetrics~=1.6.0",
    "lightning~=2.4.0",
    "rich>=10.2.2,<14.0",
]

